<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina Teach Entrance</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  text-align: center;
}
header {
  background: #123c69;
  color: white;
  padding: 22px;
}
.container {
  padding: 15px;
}
.card {
  background: white;
  padding: 20px;
  margin: 15px auto;
  max-width: 450px;
  border-radius: 12px;
}
button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  background: #123c69;
  color: white;
  font-size: 16px;
}
.hidden { display: none; }
</style>
</head>

<body>

<header>
<h1>MINA TEACH</h1>
<p>Entrance Exam Preparation</p>
</header>

<div class="container">

<div class="card" id="languages">
<h2>Select Your Language</h2>
<button onclick="selectLanguage('English')">🇬🇧 English</button>
<button onclick="selectLanguage('Afaan Oromoo')">🇪🇹 Afaan Oromoo</button>
<button onclick="selectLanguage('Amharic')">🇪🇹 Amharic</button>
<button onclick="selectLanguage('Arabic')">🇸🇦 Arabic</button>
</div>

<div class="card hidden" id="subjects">
<h2 id="subjectTitle">Choose Your Subject</h2>
<div id="subjectList"></div>
</div>

<div class="card hidden" id="quiz">
<h2 id="quizSubject"></h2>
<p id="question"></p>
<div id="answers"></div>
<p id="feedback"></p>
<button onclick="nextQuestion()">Next Question</button>
<button onclick="backSubjects()">Back to Subjects</button>
</div>

</div>

<script>
let language = "English";
let currentSubject = "";
let questionIndex = 0;
let score = 0;

const subjects = [
"English", "Mathematics", "Biology", "Chemistry",
"Physics", "General Knowledge", "Aptitude",
"Afaan Oromoo", "History", "Geography",
"Social Studies", "Civics and Ethics",
"Economics", "ICT", "Environmental Science"
];

const questions = {
"Mathematics": [
{q:"What is 5 + 7?", a:["10","12","14","15"], c:1},
{q:"What is 9 × 6?", a:["45","54","63","36"], c:1}
],
"Biology": [
{q:"Which organ pumps blood?", a:["Lung","Heart","Brain","Kidney"], c:1},
{q:"What is the basic unit of life?", a:["Cell","Tissue","Organ","Bone"], c:0}
],
"Chemistry": [
{q:"What is the chemical symbol for water?", a:["CO2","O2","H2O","NaCl"], c:2}
],
"Physics": [
{q:"What is the SI unit of force?", a:["Watt","Newton","Joule","Volt"], c:1}
],
"English": [
{q:"Choose the correct sentence.", a:["She go to school.","She goes to school.","She going school.","She gone school."], c:1}
],
"History": [
{q:"Which ancient civilization built the pyramids of Giza?", a:["Roman","Egyptian","Greek","Persian"], c:1}
],
"Geography": [
{q:"What is the largest continent?", a:["Africa","Europe","Asia","Australia"], c:2}
],
"General Knowledge": [
{q:"What is the capital of Ethiopia?", a:["Hawassa","Addis Ababa","Adama","Bahir Dar"], c:1}
],
"Aptitude": [
{q:"What comes next: 2, 4, 6, 8, ...?", a:["9","10","11","12"], c:1}
]
};

function selectLanguage(lang) {
 language = lang;
 document.getElementById("languages").classList.add("hidden");
 document.getElementById("subjects").classList.remove("hidden");
 showSubjects();
}

function showSubjects() {
 let list = document.getElementById("subjectList");
 list.innerHTML = "";
 subjects.forEach(subject => {
  let btn = document.createElement("button");
  btn.textContent = subject;
  btn.onclick = () => startQuiz(subject);
  list.appendChild(btn);
 });
}

function startQuiz(subject) {
 currentSubject = subject;
 questionIndex = 0;
 score = 0;
 document.getElementById("subjects").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}

function showQuestion() {
 let data = questions[currentSubject] || [
 {q:"Sample question: Which option is correct?", a:["Option A","Option B","Option C","Option D"], c:0}
 ];
 let item = data[questionIndex % data.length];
 document.getElementById("quizSubject").textContent = currentSubject;
 document.getElementById("question").textContent = item.q;
 document.getElementById("feedback").textContent = "";
 let answers = document.getElementById("answers");
 answers.innerHTML = "";
 item.a.forEach((answer, index) => {
  let btn = document.createElement("button");
  btn.textContent = answer;
  btn.onclick = () => {
   if(index === item.c) {
    score++;
    document.getElementById("feedback").textContent = "Correct answer!";
   } else {
    document.getElementById("feedback").textContent = "Try again! Correct answer: " + item.a[item.c];
   }
  };
  answers.appendChild(btn);
 });
}

function nextQuestion() {
 questionIndex++;
 showQuestion();
}

function backSubjects() {
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("subjects").classList.remove("hidden");
}
</script>

</body>
</html>
